<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcards+</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

    <a href="/" class="home-button">
        ← Back to BarOS
    </a>

    <div class="brand">
        <h1>Flashcards+</h1>
        <p>Powered by StudyLedgerOS</p>
    </div>

    <nav>

        <button id="tab-study" class="active">
            Study
        </button>

        <button id="tab-browse">
            Browse
        </button>

        <button id="tab-new">
            New Card
        </button>

    </nav>

</header>

<main>

<!-- =========================================
     STUDY
========================================= -->

<section id="study-view" class="view">

    <div class="card">

        <h2>Study</h2>

        <label>Subject</label>

        <select id="study-subject">

            <option value="">Select Subject</option>

            <option>Civil Procedure</option>
            <option>Constitutional Law</option>
            <option>Contracts / Sales</option>
            <option>Criminal Law and Procedure</option>
            <option>Evidence</option>
            <option>Real Property</option>
            <option>Torts</option>
            <option>Business Associations</option>
            <option>Community Property</option>
            <option>Professional Responsibility</option>
            <option>Remedies</option>
            <option>Trusts</option>
            <option>Wills and Succession</option>

        </select>

        <label>Subsubject</label>

        <select id="study-subsubject">

            <option value="">All Subsubjects</option>

        </select>

        <div class="study-card">

            <h3 id="question"></h3>

            <button id="show-answer">
                Show Answer
            </button>

            <div id="answer" hidden>

                <p></p>

            </div>

        </div>

        <div class="study-navigation">

            <button id="previous-card">
                ← Previous
            </button>

            <button id="next-card">
                Next →
            </button>

        </div>

    </div>

</section>

<!-- =========================================
     BROWSE
========================================= -->

<section id="browse-view" class="view" style="display:none;">

    <div class="card">

        <h2>Browse Flashcards</h2>

        <label>Subject</label>

        <select id="browse-subject">

            <option value="">All Subjects</option>

        </select>

        <label>Subsubject</label>

        <select id="browse-subsubject">

            <option value="">All Subsubjects</option>

        </select>

        <input
            id="search"
            type="text"
            placeholder="Search flashcards">

        <div id="card-list"></div>

    </div>

</section>

<!-- =========================================
     NEW / EDIT
========================================= -->

<section id="new-view" class="view" style="display:none;">

    <div class="card">

        <h2 id="editor-title">
            New Flashcard
        </h2>

        <label>Subject</label>

        <select id="fc-subject">

            <option value="">Select Subject</option>

            <option>Civil Procedure</option>
            <option>Constitutional Law</option>
            <option>Contracts / Sales</option>
            <option>Criminal Law and Procedure</option>
            <option>Evidence</option>
            <option>Real Property</option>
            <option>Torts</option>
            <option>Business Associations</option>
            <option>Community Property</option>
            <option>Professional Responsibility</option>
            <option>Remedies</option>
            <option>Trusts</option>
            <option>Wills and Succession</option>

        </select>

        <label>Subsubject</label>

        <input
            id="fc-subsubject"
            type="text"
            placeholder="Example: Equal Protection">

        <label>Question</label>

        <textarea
            id="fc-question"
            rows="5"
            placeholder="Question"></textarea>

        <label>Answer</label>

        <textarea
            id="fc-answer"
            rows="10"
            placeholder="Answer (include the rule in the answer)"></textarea>

        <div class="editor-buttons">

            <button id="save-card">

                Save Card

            </button>

            <button id="delete-card">

                Delete Card

            </button>

        </div>

        <div id="save-message"></div>

    </div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>

</html>
