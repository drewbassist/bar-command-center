<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards+</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">

  <a href="/" class="home-button">← Back to BarOS</a>

  <div class="brand">
    <h1>Flashcards+</h1>
    <p>Powered by StudyLedgerOS</p>
  </div>

  <nav>
    <button id="tab-study" class="active">Study</button>
    <button id="tab-browse">Browse</button>
    <button id="tab-new">New Card</button>
  </nav>

</header>

<main>

<!-- =========================
     STUDY
========================= -->

<section class="study">

  <div class="card">

    <label>Subject</label>

    <select id="study-subject">

      <option value="">Select Subject</option>

      <option>Civil Procedure</option>
      <option>Constitutional Law</option>
      <option>Contracts / Sales</option>
      <option>Criminal Law and Procedure</option>
      <option>Evidence</option>
      <option>Real Property</option>
      <option>Torts</option>
      <option>Business Associations</option>
      <option>Community Property</option>
      <option>Professional Responsibility</option>
      <option>Remedies</option>
      <option>Trusts</option>
      <option>Wills and Succession</option>

    </select>

    <label>Subsubject</label>

    <select id="study-subsubject">

      <option value="">All Subsubjects</option>

    </select>

    <h2 id="question"></h2>

    <button id="show-answer">

      Show Answer

    </button>

    <div id="answer" hidden>

      <p></p>

    </div>

    <div class="study-nav">

      <button id="prev-card">

        Previous

      </button>

      <button id="next-card">

        Next

      </button>

    </div>

  </div>

</section>

<!-- =========================
     BROWSE
========================= -->

<section id="browse-view" style="display:none">

  <h2>Browse Flashcards</h2>

</section>

<!-- =========================
     NEW CARD
========================= -->

<section id="new-view" style="display:none">

  <div class="card">

    <h2>New Flashcard</h2>

    <label>Subject</label>

    <select id="fc-subject">

      <option value="">Select Subject</option>

      <option>Civil Procedure</option>
      <option>Constitutional Law</option>
      <option>Contracts / Sales</option>
      <option>Criminal Law and Procedure</option>
      <option>Evidence</option>
      <option>Real Property</option>
      <option>Torts</option>
      <option>Business Associations</option>
      <option>Community Property</option>
      <option>Professional Responsibility</option>
      <option>Remedies</option>
      <option>Trusts</option>
      <option>Wills and Succession</option>

    </select>

    <label>Subsubject</label>

    <input
      id="fc-subsubject"
      type="text"
      placeholder="Example: Equal Protection">

    <label>Question</label>

    <textarea
      id="fc-question"
      placeholder="Question"></textarea>

    <label>Answer</label>

    <textarea
      id="fc-answer"
      placeholder="Answer (include the rule at the bottom)"></textarea>

    <button id="save-card">

      Save Card

    </button>

    <div id="save-message"></div>

  </div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
