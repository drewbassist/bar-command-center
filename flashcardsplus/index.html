<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flashcards+</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

    <a href="/" class="home-button">
        ← Back to BarOS
    </a>

    <div class="brand">
        <h1>Flashcards+</h1>
        <p>Powered by StudyLedgerOS</p>
    </div>

    

</header>

<main>

<!-- =========================================
     NEW / EDIT
========================================= -->

<section id="new-view" class="view" >

    <div class="card">

        <h2 id="editor-title">
            Flashcard Editor
        </h2>

        <label>Subject</label>

        <select id="fc-subject">

            <option value="">Select Subject</option>

            <option>Civil Procedure</option>
            <option>Constitutional Law</option>
            <option>Contracts / Sales</option>
            <option>Criminal Law and Procedure</option>
            <option>Evidence</option>
            <option>Real Property</option>
            <option>Torts</option>
            <option>Business Associations</option>
            <option>Community Property</option>
            <option>Professional Responsibility</option>
            <option>Remedies</option>
            <option>Trusts</option>
            <option>Wills and Succession</option>

        </select>

        <label>Subsubject</label>

        <input
            id="fc-subsubject"
            type="text"
            placeholder="Example: Equal Protection">

        <label>Question</label>

        <textarea
            id="fc-question"
            rows="5"
            placeholder="Question"></textarea>

        <label>Answer</label>

        <textarea
            id="fc-answer"
            rows="10"
            placeholder="Answer (include the rule in the answer)"></textarea>

        <div class="editor-buttons">

            <button id="save-card">

                Save Card

            </button>

            

        </div>

        <div id="save-message"></div>

        <hr>

        <h2>My Flashcards</h2>

        <div id="card-list"></div>

    </div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

</body>

</html>
